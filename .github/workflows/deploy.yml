name: Build staging (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: staging-manual-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/staging
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check and build staging
        env:
          DEPLOYMENT_ENV: staging
          NEXT_DISABLE_BUILD_CACHE: 'true'
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          KLAVIYO_DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          AUTH_SECRET: build-only-placeholder-not-a-runtime-secret
          AUTH_URL: https://staging.emw3-dashboard.win
        run: |
          npm ci --include=dev --no-audit --no-fund
          node --experimental-strip-types --test lib/staging-*.test.ts lib/testing-prompts-contract.test.ts lib/testing-comparison.test.ts lib/testing-chat-contract.test.ts lib/testing-insight-presentation.test.ts lib/testing-integrated-reports.test.ts lib/testing-overview-trial-sources.test.ts lib/testing-prompt-trial-report.test.ts lib/testing-prompt-run-policy.test.ts lib/testing-insight-sources.test.ts
          npm run build
          git rev-parse HEAD > .next/.staging-build-commit
          tar -C .next -czf staging-build.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: staging-build
          path: staging-build.tgz
          retention-days: 3
