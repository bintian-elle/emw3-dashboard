name: Deploy dashboard

on:
  push:
    branches: [codex/staging]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions:
  contents: read
concurrency:
  group: dashboard-deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  staging:
    if: github.event_name == 'push' || inputs.target == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy isolated staging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            export PATH=/opt/node-v24.21.0-linux-x64/bin:/home/ubuntu/.local/bin:$PATH
            cd /home/ubuntu/work/bintian/emw3-dashboard-staging
            ./deploy-staging.sh
  production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy production explicitly
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            export PATH=/opt/node-v24.21.0-linux-x64/bin:/home/ubuntu/.local/bin:$PATH
            cd /home/ubuntu/work/bintian/emw3-dashboard
            ./deploy.sh
