log_format staging_without_args '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
 listen 80;
 listen [::]:80;
 server_name staging.emw3-dashboard.win;
 access_log /var/log/nginx/emw3-staging-access.log staging_without_args;
 return 301 https://$host$request_uri;
}
server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name staging.emw3-dashboard.win;
 access_log /var/log/nginx/emw3-staging-access.log staging_without_args;
 ssl_certificate /etc/nginx/ssl/emw3-dashboard/cert.pem;
 ssl_certificate_key /etc/nginx/ssl/emw3-dashboard/key.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 2m;
 location / {
  proxy_pass http://127.0.0.1:3100;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 120s;
 }
}
